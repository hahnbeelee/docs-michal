components:
  schemas:
    AdvancedProcessingOptions:
      properties:
        ocr_system:
          type: string
          enum:
            - highres
            - multilingual
            - combined
          title: Ocr System
          description: The OCR system to use. Highres is recommended for documents with English characters.
          default: highres
        table_output_format:
          type: string
          enum:
            - html
            - json
            - md
            - jsonbbox
            - dynamic
            - ai_json
          title: Table Output Format
          description: >-
            The mode to use for table output. Dynamic returns md for simpler tables and html for more complex
            tables.
          default: html
        merge_tables:
          type: boolean
          title: Merge Tables
          description: A flag to indicate if consecutive tables with the same number of columns should be merged.
          default: false
        continue_hierarchy:
          type: boolean
          title: Continue Hierarchy
          description: A flag to indicate if the hierarchy of the document should be continued from chunk to chunk.
          default: true
        keep_line_breaks:
          type: boolean
          title: Keep Line Breaks
          description: If line breaks should be preserved in the text.
          default: false
        page_range:
          anyOf:
            - $ref: '#/components/schemas/PageRange'
            - items:
                $ref: '#/components/schemas/PageRange'
              type: array
          title: Page Range
          description: The page range to process. By default, the entire document is processed.
          default: {}
        force_file_extension:
          type: string
          title: Force File Extension
          description: Force the URL to be downloaded as a specific file extension (e.g. .png).
        large_table_chunking:
          allOf:
            - $ref: '#/components/schemas/LargeTableChunkingConfig'
          description: >-
            The configuration options for large table chunking (currently only supported on spreadsheet and
            CSV files).
          default:
            enabled: true
            size: 50
        spreadsheet_table_clustering:
          type: string
          enum:
            - default
            - disabled
          title: Spreadsheet Table Clustering
          description: On a spreadsheet, the algorithm that is used to split up sheets into multiple tables.
          default: default
        add_page_markers:
          type: boolean
          title: Add Page Markers
          description: >-
