          description: The page number to stop processing at (1-indexed).
      type: object
      title: PageRange
    ParseBlock:
      properties:
        type:
          type: string
          enum:
            - Header
            - Footer
            - Title
            - Section Header
            - Page Number
            - List Item
            - Figure
            - Table
            - Key Value
            - Text
            - Comment
            - Discard
          title: Type
          description: The type of block extracted from the document.
        bbox:
          allOf:
            - $ref: '#/components/schemas/BoundingBox'
          description: The bounding box of the block extracted from the document.
        content:
          type: string
          title: Content
          description: The content of the block extracted from the document.
        image_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Image Url
          description: (Experimental) The URL of the image associated with the block.
      type: object
      required:
        - type
        - bbox
        - content
      title: ParseBlock
    ParseChunk:
      properties:
        content:
          type: string
          title: Content
          description: The content of the chunk extracted from the document.
        embed:
          type: string
          title: Embed
          description: Chunk content optimized for embedding and retrieval.
        enriched:
          anyOf:
            - type: string
            - type: 'null'
          title: Enriched
          description: The enriched content of the chunk extracted from the document.
        enrichment_success:
          type: boolean
          title: Enrichment Success
          description: Whether the enrichment was successful.
          default: false
        blocks:
          items:
            $ref: '#/components/schemas/ParseBlock'
          type: array
          title: Blocks
      type: object
      required:
        - content
        - embed
        - enriched
        - blocks
      title: ParseChunk
    ParseConfig:
      properties:
        document_url:
          anyOf:
            - type: string
            - items:
                type: string
              type: array
          title: Document Url
          description: >-
            The URL of the document to process. Either a public URL or a presigned URL with a valid expiration
            time.
        config:
          allOf:
            - $ref: '#/components/schemas/ProcessingOptions'
          description: The configuration options for processing the document.
          default:
            pdf_ocr: ocr
            ocr_system: textract
            table_output_format: html
            infer_table_color: false
            chunk_mode: variable
            disable_chunking: false
            continue_hierarchy: true
            mode: document
            table_summary: true
            figure_summary: false
            figure_summary_override: false
            chart_extract: false
            enrich: false
            beta_layout_enrichment: false
            ignore_blocks:
              - Page Number
              - Header
              - Footer
              - Comment
            merge_tables: false
            dpi: 150
            force_url_result: false
            enhanced_docx_conversion: false
            json_bbox: false
            experimental_large_spreadsheet_table_chunking: false
            use_checkboxes: false
            use_equations: false
            page_range:
              - {}
            keep_line_breaks: false
            overlap_threshold: 0.5
            large_table_chunking: true
            large_table_chunking_size: 50
            rotate_pages: false
            enable_underlines: false
            enable_scripts: false
            return_figure_images: false
            spreadsheet_table_clustering: default
            danger_filter_wide_boxes: false
            add_page_markers: false
            remove_text_formatting: false
            return_ocr_data: false
        async:
          allOf:
            - $ref: '#/components/schemas/AsyncConfig'
          description: The configuration options for asynchronous processing (default synchronous).
          default:
            enabled: false
            priority: false
      type: object
      required:
        - document_url
      title: ParseConfig
      description: Configuration for parsing a document
    ParseConfigNew:
      properties:
        options:
          allOf:
            - $ref: '#/components/schemas/BaseProcessingOptions'
          default:
            extraction_mode: ocr
            chunking:
              chunk_mode: variable
            table_summary:
              enabled: false
            figure_summary:
              enabled: false
              override: false
            filter_blocks:
              - Page Number
              - Header
              - Footer
              - Comment
            force_url_result: false
        advanced_options:
          allOf:
            - $ref: '#/components/schemas/AdvancedProcessingOptions'
          default:
            ocr_system: highres
            table_output_format: html
            merge_tables: false
            continue_hierarchy: true
            keep_line_breaks: false
            page_range: {}
            large_table_chunking:
              enabled: true
              size: 50
            spreadsheet_table_clustering: default
            add_page_markers: false
            remove_text_formatting: false
            return_ocr_data: false
        experimental_options:
          allOf:
            - $ref: '#/components/schemas/ExperimentalProcessingOptions'
          default:
            enrich:
              enabled: false
            native_office_conversion: false
            enable_checkboxes: false
            enable_equations: false
            rotate_pages: false
            enable_underlines: false
            enable_scripts: false
            return_figure_images: false
            danger_filter_wide_boxes: false
        document_url:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/UploadResponse'
          title: Document Url
          description: >-
            The URL of the document to be processed. You can provide one of the following:

            1. A publicly available URL

            2. A presigned S3 URL

            3. A reducto:// prefixed URL obtained from the /upload endpoint after directly uploading a
            document
      additionalProperties: false
      type: object
      required:
        - document_url
      title: ParseConfigNew
    ParseResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        duration:
          type: number
          title: Duration
          description: The duration of the parse request in seconds.
        pdf_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Pdf Url
          description: The storage URL of the converted PDF file.
        usage:
          $ref: '#/components/schemas/ParseUsage'
        result:
          anyOf:
            - $ref: '#/components/schemas/FullResult'
            - $ref: '#/components/schemas/UrlResult'
          title: Result
          description: >-
            The response from the document processing service. Note that there can be two types of responses,
            Full Result and URL Result. This is due to limitations on the max return size on HTTPS. If the
            response is too large, it will be returned as a presigned URL in the URL response. You should
            handle this in your application.
      type: object
      required:
        - job_id
        - duration
        - usage
        - result
      title: ParseResponse
    ParseUsage:
      properties:
        num_pages:
          type: integer
          title: Num Pages
      type: object
      required:
        - num_pages
      title: ParseUsage
    ProcessingOptions:
      properties:
        pdf_ocr:
          type: string
          enum:
            - hybrid
            - pdf
            - ocr
          title: Pdf Ocr
          description: >-
            The method to use for OCR. hybrid uses the PDF text first, then OCR. pdf only uses the PDF text.
            ocr only uses OCR.
          default: ocr
        ocr_system:
          type: string
          enum:
            - gcloud
            - textract
            - tesseract
            - combined
          title: Ocr System
          description: The OCR system to use. Defaults to cloud (AWS Textract/Azure DocAI/etc).
          default: textract
        document_password:
          type: string
          title: Document Password
          description: Password to decrypt password-protected documents.
        table_output_format:
          type: string
          enum:
            - html
            - json
            - md
            - dynamic
            - ai_json
          title: Table Output Format
          description: The mode to use for table output. Defaults to html.
          default: html
        infer_table_color:
          type: boolean
          title: Infer Table Color
          description: If table cell colors should be used to determine table structure. Defaults to False.
          default: false
        chunk_mode:
          type: string
          enum:
            - variable
            - section
            - page
            - disabled
            - block
          title: Chunk Mode
          description: >-
            The mode to use for chunking. Defaults to 'variable'. Section chunks according to sections in the
            document. Page chunks according to pages. Disabled returns a single chunk.
          default: variable
        chunk_size:
          type: integer
          title: Chunk Size
          description: >-
            The approximate size of chunks (in characters) that the document will be split into. Defaults to
            None, in which case the chunk size is variable between 250 - 1500 characters.
        disable_chunking:
          type: boolean
          title: Disable Chunking
          description: DEPRECATED, use chunk_mode=disabled instead
          default: false
        continue_hierarchy:
          type: boolean
          title: Continue Hierarchy
          description: >-
            A flag to indicate if the hierarchy of the document should be continued from chunk to chunk. E.g.
            ## Prev Section (cont.)
          default: true
        mode:
          type: string
          enum:
            - document
            - deck
            - auto
          title: Mode
          description: >-
            The type of document to be processed. Defaults to document. If auto is specified, the orientation
            of the first page will be used to determine the document type.
          default: document
        table_summary:
          type: boolean
          title: Table Summary
          description: If tables should be summarized for embedding. Defaults to True.
          default: true
        table_summary_prompt:
          type: string
          title: Table Summary Prompt
          description: Add information to the prompt for table summarization.
        figure_summary:
          type: boolean
          title: Figure Summary
          description: A flag to indicate if figure summarization should be performed. Defaults to False.
          default: false
        figure_summary_prompt:
          type: string
          title: Figure Summary Prompt
          description: Add information to the prompt for figure summarization.
        figure_summary_override:
          type: boolean
          title: Figure Summary Override
          description: If the figure summary prompt should override our default prompt.
          default: false
        chart_extract:
          type: boolean
          title: Chart Extract
          description: >-
            A flag to indicate if bar chart extraction should be performed (requires figure_summary=True).
            Defaults to False.
          default: false
        enrich:
          type: boolean
          title: Enrich
          description: >-
            If enabled, a large language/vision model will be used to postprocess the extracted content.
            Defaults to False.
          default: false
        enrich_prompt:
          type: string
          title: Enrich Prompt
          description: Add information to the prompt for enrichment.
        beta_layout_enrichment:
          type: boolean
          title: Beta Layout Enrichment
          description: >-
            If enabled, a large language/vision model will be used to postprocess the layout predictions.
            Defaults to False.
          default: false
        ignore_blocks:
          items:
            type: string
            enum:
              - Header
              - Footer
              - Title
              - Section Header
              - Page Number
              - List Item
              - Figure
              - Table
              - Key Value
              - Text
              - Comment
              - Discard
          type: array
          title: Ignore Blocks
          description: A list of block types to ignore. Defaults to ['Page Number', 'Header', 'Footer', 'Comment'].
          default:
            - Page Number
            - Header
            - Footer
            - Comment
        merge_tables:
          type: boolean
          title: Merge Tables
          description: >-
            A flag to indicate if consecutive tables with the same number of columns should be merged.
            Defaults to False.
          default: false
        dpi:
          type: integer
          title: Dpi
          description: >-
            The dots per inch (DPI) setting for image processing. Higher values increase resolution but
            increase latency. The maximum recommended value is 300.
          default: 150
        force_url_result:
          type: boolean
          title: Force Url Result
          description: Force the result to be returned in URL form.
          default: false
        force_file_extension:
          anyOf:
            - type: string
            - type: 'null'
          title: Force File Extension
          description: Force the URL to be downloaded as a specific file extension (e.g. `.png`).
        custom_format:
          type: string
          enum:
            - aml
            - ai_usage
          title: Custom Format
        enhanced_docx_conversion:
          type: boolean
          title: Enhanced Docx Conversion
          description: >-
            Instead of using LibreOffice, when enabled, this flag uses a Windows VM to convert docx files.
            This is slower but more accurate.
          default: false
        json_bbox:
          type: boolean
          title: Json Bbox
          description: If True, include bounding box information in JSON table output. Defaults to False.
          default: false
        experimental_large_spreadsheet_table_chunking:
          type: boolean
          title: Experimental Large Spreadsheet Table Chunking
          description: >-
            Note, this is an alpha feature subject to change at any time. If enabled, large tables will be
            chunked into multiple tables. Defaults to False.
          default: false
        use_checkboxes:
          type: boolean
          title: Use Checkboxes
          description: Add checkboxes to the output, defaults to False
          default: false
        use_equations:
          type: boolean
          title: Use Equations
          description: Add equations to the output, defaults to False
          default: false
        page_start:
          type: integer
          title: Page Start
          description: The page number to start processing from.
        page_end:
          type: integer
          title: Page End
          description: The page number to stop processing at.
        page_range:
          anyOf:
            - $ref: '#/components/schemas/PageRange'
            - items:
                $ref: '#/components/schemas/PageRange'
              type: array
          title: Page Range
          description: The page range to process.
          default: {}
        keep_line_breaks:
          type: boolean
          title: Keep Line Breaks
          description: If line breaks should be preserved in the text. Defaults to False.
          default: false
        overlap_threshold:
          type: number
          title: Overlap Threshold
          description: The threshold for box overlap. Defaults to 0.5.
          default: 0.5
        large_table_chunking:
          type: boolean
          title: Large Table Chunking
          description: >-
            If large tables should be chunked into smaller tables, currently only supported on spreadsheet and
            CSV files.
          default: true
        large_table_chunking_size:
          type: integer
          title: Large Table Chunking Size
          description: The max row/column size for a table to be chunked. Defaults to 50.
          default: 50
        rotate_pages:
          type: boolean
          title: Rotate Pages
          description: Use an orientation model to detect and rotate pages as needed, defaults to False
          default: false
        enable_underlines:
          type: boolean
          title: Enable Underlines
          description: >-
            Add <u> tag around text that's underlined and surround strikethroughs and underlines with <change>
            tags, defaults to False
          default: false
        enable_scripts:
          type: boolean
          title: Enable Scripts
          description: Add <sub> tag around subscripts and <sup> tag around superscripts, defaults to False
          default: false
        return_figure_images:
          type: boolean
          title: Return Figure Images
          description: If figure images should be returned in the result. Defaults to False.
          default: false
        spreadsheet_table_clustering:
          type: string
          enum:
            - default
            - disabled
          title: Spreadsheet Table Clustering
          description: On a spreadsheet, the algorithm that is used to split up sheets into multiple tables.
          default: default
        danger_filter_wide_boxes:
          type: boolean
          title: Danger Filter Wide Boxes
          description: >-
            If True, filter out boxes with width greater than 50% of the document width. Defaults to False.
            You probably don't want to use this.
          default: false
        add_page_markers:
          type: boolean
          title: Add Page Markers
          description: If True, add page markers to the output. Defaults to False.
          default: false
        customer_id:
          type: string
          title: Customer Id
          description: Override the customer ID for the request. Defaults to None.
        remove_text_formatting:
          type: boolean
          title: Remove Text Formatting
          description: If True, remove text formatting from the output (e.g. hyphens for list items). Defaults to False.
          default: false
        return_ocr_data:
          type: boolean
          title: Return Ocr Data
          description: If True, return OCR data in the result. Defaults to False.
          default: false
        bucket_name:
          type: string
          title: Bucket Name
          description: The name of the bucket to use for the document.
        kms_arn:
          type: string
          title: Kms Arn
          description: The AWS KMS key to use for the document.
      type: object
      title: ProcessingOptions
    SplitCategory:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        partition_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Partition Key
      type: object
      required:
        - name
        - description
      title: SplitCategory
    SplitConfig:
      properties:
        options:
          allOf:
            - $ref: '#/components/schemas/BaseProcessingOptions'
          default:
            extraction_mode: ocr
            chunking:
              chunk_mode: variable
            table_summary:
              enabled: false
            figure_summary:
              enabled: false
              override: false
            filter_blocks:
              - Page Number
              - Header
              - Footer
              - Comment
            force_url_result: false
        advanced_options:
          allOf:
            - $ref: '#/components/schemas/AdvancedProcessingOptions'
          default:
            ocr_system: highres
            table_output_format: html
            merge_tables: false
            continue_hierarchy: true
            keep_line_breaks: false
            page_range: {}
            large_table_chunking:
              enabled: true
              size: 50
            spreadsheet_table_clustering: default
            add_page_markers: false
            remove_text_formatting: false
            return_ocr_data: false
        experimental_options:
          allOf:
            - $ref: '#/components/schemas/ExperimentalProcessingOptions'
          default:
            enrich:
              enabled: false
            layout_enrichment: false
            native_office_conversion: false
            enable_checkboxes: false
            enable_equations: false
            rotate_pages: false
            enable_underlines: false
            enable_scripts: false
            return_figure_images: false
            danger_filter_wide_boxes: false
        document_url:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/UploadResponse'
          title: Document Url
          description: >-
            The URL of the document to be processed. You can provide one of the following:

            1. A publicly available URL

            2. A presigned S3 URL

            3. A reducto:// prefixed URL obtained from the /upload endpoint after directly uploading a
            document
        split_description:
          items:
            $ref: '#/components/schemas/SplitCategory'
          type: array
          title: Split Description
          description: The configuration options for processing the document.
        split_rules:
          type: string
          title: Split Rules
          description: The rules for splitting the document.
          default: >-
            Split the document into the applicable sections. Sections may only overlap at their first and last
            page if at all.
      additionalProperties: false
      type: object
      required:
        - document_url
        - split_description
      title: SplitConfig
    SplitResponse:
      properties:
        usage:
          $ref: '#/components/schemas/ParseUsage'
        result:
          allOf:
            - $ref: '#/components/schemas/SplitResult'
          description: >-
            The extracted response in your provided schema. This is a list of dictionaries. If
            disbale_chunking is True (default), then it will be a list of length one.
      type: object
      required:
        - usage
        - result
      title: SplitResponse
    SplitResult:
      properties:
        section_mapping:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Section Mapping
      type: object
      required:
        - section_mapping
      title: SplitResult
    TableSummaryConfig:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: If table summarization should be performed.
          default: false
        prompt:
          type: string
          title: Prompt
          description: Add information to the prompt for table summarization.
      type: object
      title: TableSummaryConfig
    UploadResponse:
      properties:
        file_id:
          type: string
          title: File Id
        presigned_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Presigned Url
      type: object
      required:
        - file_id
      title: UploadResponse
    UrlResult:
      properties:
        type:
          type: string
          enum:
            - url
          const: url
          title: Type
          description: type = 'url'
        url:
          type: string
          title: Url
        result_id:
          type: string
          title: Result Id
      type: object
      required:
        - type
        - url
        - result_id
      title: UrlResult
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    WebhookConfig:
      properties:
        url:
          anyOf:
            - type: string
            - type: 'null'
          title: Url
        mode:
          type: string
          enum:
            - direct
            - svix
          title: Mode
          default: direct
        metadata:
          title: Metadata
        channels:
          items:
            type: string
          type: array
          title: Channels
          description: A list of Svix channels the message will be delivered down, omit to send to all channels.
      type: object
      title: WebhookConfig
    WebhookConfigNew:
      properties:
        mode:
          type: string
          enum:
            - disabled
            - svix
            - direct
          title: Mode
          description: >-
            The mode to use for webhook delivery. Defaults to 'disabled'. We recommend using 'svix' for
            production environments.
          default: disabled
        url:
          type: string
          title: Url
          description: The URL to send the webhook to (if using direct webhoook).
        metadata:
          title: Metadata
          description: JSON metadata included in webhook request body
        channels:
          items:
            type: string
          type: array
          title: Channels
          description: A list of Svix channels the message will be delivered down, omit to send to all channels.
      type: object
      title: WebhookConfigNew
  securitySchemes:
    SkippableHTTPBearer:
      type: http
      scheme: bearer
