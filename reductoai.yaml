paths:
  /split:
    post:
      summary: Split
      operationId: split_split_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - SkippableHTTPBearer: []
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Reducto from 'reductoai';

            const client = new Reducto({
              apiKey: process.env['REDUCTO_API_KEY'], // This is the default and can be omitted
            });

            async function main() {
              const splitResponse = await client.split.run({
                document_url: 'string',
                split_description: [{ description: 'description', name: 'name' }],
              });

              console.log(splitResponse.result);
            }

            main();
        - lang: Python
          source: |-
            import os
            from reducto import Reducto

            client = Reducto(
                api_key=os.environ.get("REDUCTO_API_KEY"),  # This is the default and can be omitted
            )
            split_response = client.split.run(
                document_url="string",
                split_description=[{
                    "description": "description",
                    "name": "name",
                }],
            )
            print(split_response.result)
        - lang: Go
          source: |
            package main

            import (
              "context"
              "fmt"

              "github.com/reductoai/reducto-go-sdk"
              "github.com/reductoai/reducto-go-sdk/option"
              "github.com/reductoai/reducto-go-sdk/shared"
            )

            func main() {
              client := reducto.NewClient(
                option.WithAPIKey("My API Key"), // defaults to os.LookupEnv("REDUCTO_API_KEY")
              )
              splitResponse, err := client.Split.Run(context.TODO(), reducto.SplitRunParams{
                DocumentURL: reducto.F[reducto.SplitRunParamsDocumentURLUnion](shared.UnionString("string")),
                SplitDescription: reducto.F([]shared.SplitCategoryParam{shared.SplitCategoryParam{
                  Description: reducto.F("description"),
                  Name: reducto.F("name"),
                }}),
              })
              if err != nil {
                panic(err.Error())
              }
              fmt.Printf("%+v\n", splitResponse.Result)
            }
